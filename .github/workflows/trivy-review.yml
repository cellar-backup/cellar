# =============================================================================
# Cellar — Trivy Suppression Review
#
# Runs monthly to check if suppressed CVEs in .trivyignore have been fixed
# upstream. Opens an issue if any can be removed.
# =============================================================================

name: Review Trivy Suppressions

on:
  schedule:
    # First Monday of every month at 09:00 UTC
    - cron: '0 9 1-7 * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  review:
    name: Check suppressed CVEs
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Parse .trivyignore and check CVE status
        id: check
        run: |
          echo "## Trivy Suppression Review" > report.md
          echo "" >> report.md
          echo "Checking if suppressed CVEs have been fixed upstream." >> report.md
          echo "" >> report.md

          REMOVABLE=0
          TOTAL=0
          CURRENT_DATE=""

          # First pass: build a map of CVE → Added date by tracking the most
          # recent "Added:" comment as we read the file top to bottom
          declare -A CVE_DATES
          while IFS= read -r line; do
            if [[ "$line" =~ ^#.*Added:\ *(.+) ]]; then
              CURRENT_DATE="${BASH_REMATCH[1]}"
            elif [[ "$line" =~ ^CVE- ]]; then
              CVE=$(echo "$line" | awk '{print $1}')
              CVE_DATES["$CVE"]="$CURRENT_DATE"
            fi
          done < .trivyignore

          # Second pass: check each CVE
          for CVE in "${!CVE_DATES[@]}"; do
            TOTAL=$((TOTAL + 1))
            ADDED="${CVE_DATES[$CVE]}"

            # Query NVD API to check if CVE is still active
            # (NVD returns vuln data; if status is "Rejected" or "Modified" with
            # no affected versions, it may be resolved)
            HTTP_CODE=$(curl -s -o /tmp/cve_response.json -w "%{http_code}" \
              "https://services.nvd.nist.gov/rest/json/cves/2.0?cveId=$CVE" 2>/dev/null)

            REJECTED=""
            if [ "$HTTP_CODE" = "200" ]; then
              REJECTED=$(jq -r '.vulnerabilities[0].cve.vulnStatus // ""' /tmp/cve_response.json 2>/dev/null)
            fi

            if [ "$REJECTED" = "Rejected" ] || [ "$REJECTED" = "Deferred" ]; then
              echo "- :white_check_mark: **$CVE** — Status: $REJECTED. Can be removed." >> report.md
              REMOVABLE=$((REMOVABLE + 1))
            elif [ -n "$ADDED" ]; then
              DAYS_AGO=$(( ($(date +%s) - $(date -d "$ADDED" +%s 2>/dev/null || echo "$(date +%s)")) / 86400 ))
              if [ "$DAYS_AGO" -gt 90 ]; then
                echo "- :warning: **$CVE** — Suppressed for ${DAYS_AGO} days (added $ADDED). Review if upstream has a fix." >> report.md
                REMOVABLE=$((REMOVABLE + 1))
              else
                echo "- :hourglass: **$CVE** — Suppressed ${DAYS_AGO} days ago (added $ADDED). NVD status: ${REJECTED:-Active}." >> report.md
              fi
            else
              echo "- :grey_question: **$CVE** — No added date found. Review manually." >> report.md
              REMOVABLE=$((REMOVABLE + 1))
            fi

            # Rate limit: NVD allows ~5 requests per 30 seconds without API key
            sleep 6
          done

          echo "" >> report.md
          echo "**Total suppressed:** $TOTAL | **Needs review:** $REMOVABLE" >> report.md

          echo "removable=$REMOVABLE" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

      - name: Open issue if CVEs need review
        if: steps.check.outputs.removable > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if an open issue already exists
          EXISTING=$(gh issue list --label "trivy-review" --state open --json number -q '.[0].number')

          if [ -n "$EXISTING" ]; then
            # Update existing issue
            gh issue comment "$EXISTING" --body "$(cat report.md)"
            echo "Updated existing issue #$EXISTING"
          else
            # Create new issue
            gh issue create \
              --title "Review Trivy suppressed CVEs (${{ steps.check.outputs.removable }} of ${{ steps.check.outputs.total }} need attention)" \
              --body "$(cat report.md)" \
              --label "trivy-review,security"
            echo "Created new issue"
          fi

      - name: Summary
        run: |
          echo "### Trivy Suppression Review" >> $GITHUB_STEP_SUMMARY
          cat report.md >> $GITHUB_STEP_SUMMARY
