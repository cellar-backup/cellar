name: influxdb-backup
version: 1
type: custom
description: Back up InfluxDB using the influx CLI
backup_command: >
  influx backup /tmp/influx-dump --host ${INFLUX_HOST}
restore_command: >
  influx restore /tmp/influx-dump --host ${INFLUX_HOST}
env_vars:
  - INFLUX_HOST
  - INFLUX_TOKEN
stream_to_engine: true
