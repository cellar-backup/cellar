# =============================================================================
# Cellar — Nginx Configuration (unified container)
#
# Single port 8420:
#   /build/*      → Vite-built static assets (served directly)
#   /logo.svg     → App logo
#   /app/*        → Reverb WebSocket (127.0.0.1:8080)
#   /*            → Laravel (PHP, handles API + SPA catch-all)
# =============================================================================

server {
    listen 8420 default_server;
    server_name _;

    root /app/public;
    index index.php;

    # ── Vite-built assets (long cache, served directly) ──
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Static public files ──────────────────────
    location ~* \.(svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ── Reverb WebSocket (Pusher protocol) ───────
    location /app/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # ── Everything else → Laravel ────────────────
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Disable access log for health checks
    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
