# =============================================================================
# Cellar — Kubernetes Sample Manifest
#
# Deploys Cellar + Redis in a single namespace.
# Customize to your needs: Ingress, TLS, storage classes, resource limits, etc.
#
# Usage:
#   kubectl apply -f cellar.yaml
#   kubectl port-forward -n cellar svc/cellar 8420:8420
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: cellar

---
# ── Redis ────────────────────────────────────────────────────────────────────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: cellar
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: cellar
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: redis-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: cellar
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: cellar
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - port: 6379
      targetPort: 6379

---
# ── Cellar ───────────────────────────────────────────────────────────────────

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cellar-data
  namespace: cellar
  labels:
    app.kubernetes.io/name: cellar
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cellar-repos
  namespace: cellar
  labels:
    app.kubernetes.io/name: cellar
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 50Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cellar
  namespace: cellar
  labels:
    app.kubernetes.io/name: cellar
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cellar
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cellar
    spec:
      containers:
        - name: cellar
          image: ghcr.io/cellar-backup/cellar:latest
          ports:
            - containerPort: 8420
          env:
            - name: REDIS_HOST
              value: redis
            - name: APP_URL
              value: http://localhost:8420
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: repos
              mountPath: /data/repositories
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/v1/system/health
              port: 8420
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/system/health
              port: 8420
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cellar-data
        - name: repos
          persistentVolumeClaim:
            claimName: cellar-repos

---
apiVersion: v1
kind: Service
metadata:
  name: cellar
  namespace: cellar
  labels:
    app.kubernetes.io/name: cellar
spec:
  selector:
    app.kubernetes.io/name: cellar
  ports:
    - port: 8420
      targetPort: 8420

