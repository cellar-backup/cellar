# =============================================================================
# Cellar — PostgreSQL Override
# Use this when you want PostgreSQL instead of the default SQLite.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker/docker-compose.postgres.yml up -d
# =============================================================================

services:
  cellar-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CELLAR_DB_NAME:-cellar}
      POSTGRES_USER: ${CELLAR_DB_USER:-cellar}
      POSTGRES_PASSWORD: ${CELLAR_DB_PASSWORD:-cellar}
    volumes:
      - cellar-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CELLAR_DB_USER:-cellar}"]
      interval: 10s
      timeout: 5s
      retries: 5

  cellar-api:
    depends_on:
      cellar-db:
        condition: service_healthy
      cellar-redis:
        condition: service_healthy
    environment:
      CELLAR_DB_ENGINE: postgresql
      CELLAR_DB_NAME: ${CELLAR_DB_NAME:-cellar}
      CELLAR_DB_USER: ${CELLAR_DB_USER:-cellar}
      CELLAR_DB_PASSWORD: ${CELLAR_DB_PASSWORD:-cellar}
      CELLAR_DB_HOST: cellar-db
      CELLAR_DB_PORT: "5432"

  cellar-worker:
    depends_on:
      cellar-db:
        condition: service_healthy
      cellar-redis:
        condition: service_healthy
    environment:
      CELLAR_DB_ENGINE: postgresql
      CELLAR_DB_NAME: ${CELLAR_DB_NAME:-cellar}
      CELLAR_DB_USER: ${CELLAR_DB_USER:-cellar}
      CELLAR_DB_PASSWORD: ${CELLAR_DB_PASSWORD:-cellar}
      CELLAR_DB_HOST: cellar-db
      CELLAR_DB_PORT: "5432"

  cellar-beat:
    depends_on:
      cellar-db:
        condition: service_healthy
      cellar-redis:
        condition: service_healthy
    environment:
      CELLAR_DB_ENGINE: postgresql
      CELLAR_DB_NAME: ${CELLAR_DB_NAME:-cellar}
      CELLAR_DB_USER: ${CELLAR_DB_USER:-cellar}
      CELLAR_DB_PASSWORD: ${CELLAR_DB_PASSWORD:-cellar}
      CELLAR_DB_HOST: cellar-db
      CELLAR_DB_PORT: "5432"

volumes:
  cellar-db-data:
