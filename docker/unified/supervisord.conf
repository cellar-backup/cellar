; =============================================================================
; Cellar — Supervisord Configuration (unified container)
;
; Manages: nginx, php api, horizon worker, scheduler, reverb, optional redis
; =============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
logfile_maxbytes=10MB
logfile_backups=2

; ---------- Redis (optional — conditionally started by entrypoint) ----------
[program:redis]
command=redis-server --save 60 1 --loglevel warning --bind 127.0.0.1 --protected-mode yes
autostart=%(ENV_CELLAR_REDIS_AUTOSTART)s
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ---------- Nginx (serves frontend + proxies API/WS) ----------
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ---------- PHP API Server ----------
[program:api]
command=php /app/artisan serve --host=127.0.0.1 --port=8000
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ---------- Horizon (queue worker) ----------
[program:horizon]
command=php /app/artisan horizon
autostart=true
autorestart=true
priority=40
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ---------- Scheduler ----------
[program:scheduler]
command=php /app/artisan schedule:work
autostart=true
autorestart=true
priority=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ---------- Reverb WebSocket Server ----------
[program:reverb]
command=php /app/artisan reverb:start --host=127.0.0.1 --port=8080
autostart=true
autorestart=true
priority=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
