# =============================================================================
# Cellar — Nginx Configuration (unified container)
#
# Single port 8420:
#   /api/*        → PHP API (127.0.0.1:8000)
#   /horizon/*    → Horizon dashboard
#   /sanctum/*    → CSRF cookie
#   /app/*        → Reverb WebSocket (127.0.0.1:8080)
#   /*            → Vue SPA (static files)
# =============================================================================

server {
    listen 8420 default_server;
    server_name _;

    root /app/public/spa;
    index index.html;

    # ── API proxy ────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Horizon dashboard ────────────────────────
    location /horizon {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Sanctum (CSRF cookie) ────────────────────
    location /sanctum/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Reverb WebSocket (Pusher protocol) ───────
    location /app/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # ── Static assets (long cache) ──────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Vue SPA catch-all ────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable access log for health checks
    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
